<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroCam Architecture Preview</title>
    <!-- GitHub Markdown CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown.min.css">
    <style>
        body {
            box-sizing: border-box;
            min-width: 200px;
            max-width: 980px;
            margin: 0 auto;
            padding: 45px;
        }
        @media (max-width: 767px) {
            body {
                padding: 15px;
            }
        }
        .mermaid {
            background-color: white !important;
            display: flex;
            justify-content: center;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
    </style>
</head>
<body class="markdown-body">
    <div id="content">Loading architecture...</div>

    <!-- Marked for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Mermaid for diagram rendering -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: false });

        let lastContent = '';

        async function render() {
            try {
                const response = await fetch('ARCHITECTURE.md?t=' + Date.now());
                const text = await response.text();
                
                if (text === lastContent) return;
                lastContent = text;

                // Parse markdown
                const html = marked.parse(text);
                document.getElementById('content').innerHTML = html;

                // Find mermaid code blocks and transform them into div.mermaid
                const codeBlocks = document.querySelectorAll('pre code.language-mermaid');
                codeBlocks.forEach((block) => {
                    const pre = block.parentElement;
                    const div = document.createElement('div');
                    div.className = 'mermaid';
                    div.textContent = block.textContent;
                    pre.replaceWith(div);
                });

                // Run mermaid
                await mermaid.run();
                console.log('Refreshed ARCHITECTURE.md');
            } catch (err) {
                console.error('Error refreshing content:', err);
            }
        }

        // Initial render
        render();

        // Poll for changes every 2 seconds
        setInterval(render, 2000);
    </script>
</body>
</html>
